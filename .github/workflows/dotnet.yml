name: .NET CI

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        cache: true
        cache-dependency-path: '**/packages.lock.json'

    - name: Restore dependencies
      run: dotnet restore AdaTranslation.sln

    - name: Build Solution
      run: dotnet build AdaTranslation.sln --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test AdaTranslation.sln --no-build --configuration Release --verbosity normal
